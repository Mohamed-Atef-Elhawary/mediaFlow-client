<div class="flex flex-col gap-6 py-6">
  <div class="flex flex-col md:flex-row gap-6 px-1 dark:bg-slate-800">
    <div class="w-full h-[400px] md:w-[30%]">
      <img class="w-full h-full object-cover" [src]="myDoctor().image" alt="" />
    </div>
    <div class="border-2 border-gray-200 grow p-6 flex flex-col h-[400px]gap-6 bg-transparent">
      <section class="flex flex-col gap-2">
        <h1 class="font-semibold text-2xl md:text-[3vw] text-dark dark:text-white">
          {{ myDoctor().name }}
          @if (myDoctor().available) {
            <fa-icon [icon]="checkIcon" class="text-primary"></fa-icon>
          } @else {
            <fa-icon [icon]="xIcon" class="text-primary"></fa-icon>
          }
        </h1>
        <p class="text-xl md:text-[2vw] text-secondary dark:text-slate-400">
          {{ myDoctor().degree }}-{{ myDoctor().speciality }}
          <span class="border py-2 px-3 rounded-full hidden sm:inline"
            >{{ myDoctor().experience }} Years</span
          >
        </p>
      </section>
      <section class="text-secondary dark:text-slate-300">
        <h2 class="font-medium text-2xl md:text-[2.5vw]">
          About
          <fa-icon [icon]="infoIcon"></fa-icon>
        </h2>
        <p class="text-xl md:text-[2vw]">{{ myDoctor().about }}</p>
      </section>
      <p class="text-secondary font-medium text-2xl md:text-[2.5vw] dark:text-slate-300">
        Appointment price:

        <span class="text-dark font-medium dark:text-slate-200">{{
          myDoctor().consultationFee | currency: 'EGP' : 'symbol'
        }}</span>
      </p>
    </div>
  </div>
  <div class="">
    <app-doc-rank [ranking]="ranking()" (onreview)="startReviewing($event)"></app-doc-rank>
  </div>
  <div class="">
    <app-appointment-booking [docId]="myDoctor()._id"></app-appointment-booking>
  </div>
  <div id="doc-reviews" class="">
    @if (myDoctor()._id) {
      <app-all-reviews [docId]="myDoctor()._id"></app-all-reviews>
    }
  </div>
  <div class="">
    <app-related-doctors
      [docId]="myDoctor()._id"
      [docSpeciality]="myDoctor().speciality"
    ></app-related-doctors>
  </div>
</div>

<div
  [ngClass]="{ fixed: backDrop(), hidden: !backDrop() }"
  (click)="isBackDropToCancel($event)"
  class="w-[100vw] h-[100vh] top-0 left-0 py-[10px] px-[5px] bg-black/50 z-60 flex items-center justify-center"
>
  <div class="bg-white rounded-xl p-[10px] sm:p-[40px] w-[80%] md:w-auto dark:bg-slate-900">
    <ng-container #review></ng-container>
  </div>
</div>
