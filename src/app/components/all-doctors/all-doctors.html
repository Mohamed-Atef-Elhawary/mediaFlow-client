<div class="grid sm:grid-cols-2 md:grid-cols-3 gap-3">
  @for (doctor of allDoctors() | filterBySpecialty: speciality; track doctor._id) {
    <article
      [routerLink]="['/appointment', doctor._id]"
      class="h-[500px] lg-h-auto overflow-hidden flex flex-col p-[10px] bg-slate-50 hover:bg-sky-100 border-2 border-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700"
    >
      <div class="overflow-hidden w-full h-[65%] p-2 shrink-0">
        <img class="block w-full h-full object-cover" [src]="doctor.image" />
      </div>

      <div class="flex flex-col justify-evenly items-start p-2 mt-4 h-[35%] shrink-0">
        <p class="font-bold text-[3vw] whitespace-nowrap sm:text-[2vw] text-dark dark:text-white">
          {{ doctor.name }}
        </p>
        <p class="text-secondary font-semibold text-[3vw] sm:text-[2vw]">
          {{ doctor.speciality }}
        </p>

        <div class="flex gap-2 items-center">
          @if (doctor.available) {
            <fa-icon
              [icon]="availableIcon"
              class="rounded-full text-green-700 text-[3vw] sm:text-[3vw] md:text-[2vw]"
            ></fa-icon>
            <p class="text-green-500 text-[3vw] sm:text-[2vw] md:text-[2vw]">Available</p>
          } @else {
            <fa-icon
              [icon]="notAvailableIcon"
              class="rounded-full text-secondary text-[3vw] sm:text-[2vw]"
            ></fa-icon>
            <p class="text-secondary text-[3vw] sm:text-[2vw]">Not Available</p>
          }
        </div>
      </div>
    </article>
  }
</div>
