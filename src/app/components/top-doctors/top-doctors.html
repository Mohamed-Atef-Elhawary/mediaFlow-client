@if (topDoctors().length) {
  <div id="topDoctors" class="flex flex-col gap-10 text-center py-8 overflow-hidden">
    <div class="text-center">
      <h2 class="font-semibold text-[4vw] text-dark mb-4 dark:text-white">Top Doctors to Book</h2>
      <p class="text-[2vw] text-secondary dark:text-slate-400">
        Simply browse through our extensive list of trusted doctors.
      </p>
    </div>

    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      @for (doctor of topDoctors(); track doctor._id) {
        <article
          [routerLink]="['/appointment', doctor._id]"
          class="h-[500px] lg:h-auto overflow-hidden flex flex-col p-[10px] bg-slate-50 hover:bg-sky-100 border-2 border-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700"
        >
          <div class="overflow-hidden w-full h-[65%] p-2 shrink-0">
            <img class="block w-full h-full object-cover" [src]="doctor.image" />
          </div>

          <div class="flex flex-col justify-evenly items-start p-2 mt-4 h-[35%] shrink-0">
            <p
              class="font-bold text-[3vw] whitespace-nowrap sm:text-[2vw] text-dark dark:text-white"
            >
              {{ doctor.name }}
            </p>
            <p class="text-secondary font-semibold text-[3vw] sm:text-[2vw] dark:text-slate-400">
              {{ doctor.speciality }}
            </p>

            <div class="flex gap-2 items-center">
              @if (doctor.available) {
                <fa-icon
                  [icon]="availableIcon"
                  class="rounded-full text-green-700 text-[3vw] sm:text-[2vw]"
                ></fa-icon>
                <p class="text-green-500 text-[3vw] sm:text-[2vw]">Available</p>
              } @else {
                <fa-icon
                  [icon]="notAvailableIcon"
                  class="rounded-full text-secondary text-[3vw] sm:text-[2vw]"
                ></fa-icon>
                <p class="text-secondary text-[3vw] sm:text-[2vw]">Not Available</p>
              }
            </div>
          </div>
        </article>
      }
    </div>

    <button
      routerLink="/doctors"
      class="w-full bg-[#14263c] hover:bg-[#004b84] text-white font-semibold text-[4vw] px-1 py-2 lg:text-[2vw] md:px-3 md:py-6 shrink-0 cursor-pointer"
    >
      MORE
    </button>
  </div>
}
